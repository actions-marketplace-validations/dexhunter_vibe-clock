name: Create Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major]

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version and tag
        run: |
          # bump_version.py updates pyproject.toml *and* every place the action
          # ref is written down. Bumping pyproject alone (what this job used to
          # do) left every documented `@vX.Y.Z` pin pointing at an old release.
          python scripts/bump_version.py "${{ inputs.bump }}"
          NEW=$(grep -m1 -oP 'version = "\K[^"]+' pyproject.toml)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${NEW}"
          git tag "v${NEW}"
          git push && git push origin "v${NEW}"
