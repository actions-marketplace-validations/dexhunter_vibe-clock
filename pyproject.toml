[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe-clock"
version = "1.5.0"
description = "Track AI coding agent usage across Claude Code, Codex, Gemini CLI, and OpenCode"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "httpx>=0.25",
    "tomli>=2.0; python_version < '3.11'",
]

keywords = ["claude-code", "codex", "opencode", "gemini-cli", "github-profile", "svg", "stats"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Utilities",
]

# Without these the PyPI page carries no link back to the repository, so the
# only route from "I found this package" to "here is how to use it" is a search.
[project.urls]
Homepage = "https://github.com/dexhunter/vibe-clock"
Repository = "https://github.com/dexhunter/vibe-clock"
Issues = "https://github.com/dexhunter/vibe-clock/issues"
Changelog = "https://github.com/dexhunter/vibe-clock/releases"

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.20"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
vibe-clock = "vibe_clock.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
