name: 'Vibe Clock'
description: 'Generate AI coding agent usage SVGs for your GitHub profile — WakaTime for AI agents'
author: 'dexhunter'
branding:
  icon: 'clock'
  color: 'blue'

inputs:
  gist_id:
    description: 'GitHub Gist ID containing vibe-clock-data.json'
    required: true
  theme:
    description: 'Theme: dark or light'
    required: false
    default: 'dark'
  output_dir:
    description: 'Directory to write SVG files'
    required: false
    default: './images'
  chart_types:
    description: 'Chart types to generate (comma-separated or "all")'
    required: false
    default: 'card,donut'
  commit:
    description: 'Auto-commit generated SVGs'
    required: false
    default: 'true'
  commit_message:
    description: 'Commit message'
    required: false
    default: 'chore: update vibe-clock stats'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install vibe-clock
      shell: bash
      env:
        VIBE_CLOCK_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$VIBE_CLOCK_ACTION_PATH"

    - name: Fetch stats from gist
      shell: bash
      env:
        GIST_ID: ${{ inputs.gist_id }}
        REPO_OWNER: ${{ github.repository_owner }}
      run: |
        if [ -z "${GIST_ID}" ]; then
          echo "::error::gist_id is empty. Set the VIBE_CLOCK_GIST_ID secret on this repository (vibe-clock setup does this for you)."
          exit 1
        fi
        if ! curl -sf "https://gist.githubusercontent.com/${REPO_OWNER}/${GIST_ID}/raw/vibe-clock-data.json" \
          -o /tmp/vibe-clock-data.json; then
          echo "::error::Could not fetch vibe-clock-data.json from gist ${GIST_ID} owned by ${REPO_OWNER}. Check the gist ID, that the gist is public, and that it was created by ${REPO_OWNER}."
          exit 1
        fi

    - name: Generate SVGs
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
        CHART_TYPES: ${{ inputs.chart_types }}
        THEME: ${{ inputs.theme }}
      run: |
        mkdir -p "${OUTPUT_DIR}"
        # Print both sides of the producer/reader version pair, so a skew is
        # readable in the log instead of inferred from a wrong-looking number.
        vibe-clock --version
        python -c "import json; d = json.load(open('/tmp/vibe-clock-data.json')); print('payload schema_version=%s producer_version=%s' % (d.get('schema_version'), d.get('producer_version')))"
        vibe-clock render --from-json /tmp/vibe-clock-data.json \
          --type "${CHART_TYPES}" --theme "${THEME}" --output "${OUTPUT_DIR}"

    - name: Commit and push
      if: inputs.commit == 'true'
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
        COMMIT_MSG: ${{ inputs.commit_message }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "${OUTPUT_DIR}"
        git diff --staged --quiet && { echo "No SVG changes to commit."; exit 0; }
        git commit -m "${COMMIT_MSG}"
        # A bare `git push` here 403s on any repo that has not granted write
        # access, which is every repo by default since GITHUB_TOKEN went
        # read-only. Name the fix instead of printing a raw permission error.
        git push || {
          echo "::error::git push failed. Add this to your workflow, above \`jobs:\`:"
          echo "::error::  permissions:"
          echo "::error::    contents: write"
          exit 1
        }
